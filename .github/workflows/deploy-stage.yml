# EJEMPLO para un repo de aplicación: añadir el job "dast" al workflow que ya
# despliega a stage. Solo hay que cambiar ORG, la URL y el job de despliegue.

name: deploy-stage

on:
  push:
    branches: [stage]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Aquí va el despliegue actual del equipo a stage"

  dast:
    needs: deploy
    uses: ORG/security-pipelines/.github/workflows/security-dast-stage.yml@main
    with:
      target_url: https://stage.mi-app.ejemplo.com
      blocking: false   # cambiar a true cuando el ruido esté ajustado
